name: Validate Horizon Android patches

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  apply-engine-patches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pkg-config libasound2-dev libudev-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify and apply port patches
        run: bash scripts/apply-engine-patches.sh
      - name: Check patched Horizon client (Linux host)
        run: cargo check --manifest-path engine/horizon-upstream/Cargo.toml -p horizon-client --lib

  android-arm64-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Android NDK
        run: sdkmanager "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Set Android NDK environment
        run: |
          NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android24-clang++" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
      - name: Verify and apply port patches
        run: bash scripts/apply-engine-patches.sh
      - name: Cross-check Horizon client for Android arm64
        run: cargo check --manifest-path engine/horizon-upstream/Cargo.toml -p horizon-client --lib --target aarch64-linux-android --no-default-features
      - name: Cross-check JNI bridge for Android arm64
        run: cargo check --manifest-path bridge/Cargo.toml --target aarch64-linux-android
      - name: Build Android ARM64 native library
        run: cargo build --release --manifest-path bridge/Cargo.toml --target aarch64-linux-android
      - name: Verify native library output
        run: |
          LIBRARY="bridge/target/aarch64-linux-android/release/libhorizon_android_bridge.so"
          test -s "$LIBRARY"
          file "$LIBRARY"
          llvm-readelf -h "$LIBRARY"
      - name: Upload Android ARM64 native library
        uses: actions/upload-artifact@v4
        with:
          name: horizon-android-arm64-native
          path: bridge/target/aarch64-linux-android/release/libhorizon_android_bridge.so
          if-no-files-found: error
          retention-days: 7
