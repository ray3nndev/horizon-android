[package]
name = "horizon-android-bridge"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
horizon-client = { path = "../engine/horizon-upstream/crates/horizon-client", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
horizon-mod-host = { path = "../engine/horizon-upstream/crates/horizon-mod-host", default-features = false }
winit = { version = "0.30.13", features = ["android-game-activity"] }
